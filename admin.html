<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Accessoires - Administration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #111111;
            --white: #ffffff;
            --gold: #D4AF37;
            --light-bg: #fafafa;
            --border: #eeeeee;
            --red: #e74c3c;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--white); color: var(--black); }
        h1, h2 { font-family: 'Playfair Display', serif; }

        .header {
            height: 80px; background: var(--white); display: flex; align-items: center; 
            justify-content: space-between; padding: 0 7%; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .logo span { color: var(--gold); }

        .admin-page { padding: 40px 7%; max-width: 1200px; margin: 0 auto; }
        
        .admin-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 40px; margin-top: 30px; }

        .form-card, .list-card {
            background: var(--light-bg); padding: 30px; border-radius: 20px; box-shadow: var(--shadow);
        }

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 500; font-size: 14px; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; outline: none;
            background: var(--white);
        }

        .btn-submit {
            width: 100%; padding: 12px; background: var(--black); color: var(--white); border: none;
            border-radius: 10px; font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-submit:hover { background: var(--gold); }

        .table-admin { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .table-admin th, .table-admin td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
        .table-admin img { width: 50px; height: 50px; object-fit: cover; border-radius: 8px; }

        .btn-delete {
            background: var(--red); color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        }
        .btn-delete:hover { opacity: 0.8; }

        @media (max-width: 900px) {
            .admin-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">KEO <span>Admin</span></div>
        <a href="boutique.html" style="text-decoration:none; color:inherit; font-weight:500;">Retour Boutique ↗</a>
    </header>

    <section class="admin-page">
        <h1>Gestion des Produits</h1>

        <div class="admin-grid">
            <!-- Formulaire d'ajout -->
            <div class="form-card">
                <h2>Ajouter un bijou</h2>
                <form id="form-produit">
                    <div class="form-group">
                        <label>Nom du bijou</label>
                        <input type="text" id="nom" required placeholder="Ex: Bague Dorée KEO">
                    </div>
                    <div class="form-group">
                        <label>Prix (FCFA)</label>
                        <input type="number" id="prix" required placeholder="15000">
                    </div>
                    <div class="form-group">
                        <label>Catégorie</label>
                        <select id="categorie" required>
                            <option value="Collier">Collier</option>
                            <option value="Bracelet">Bracelet</option>
                            <option value="Bague">Bague</option>
                            <option value="Parure">Parure</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Stock</label>
                        <input type="number" id="stock" required value="10">
                    </div>
                    <div class="form-group">
                        <label>Image du bijou (Fichier)</label>
                        <input type="file" id="image-file" accept="image/*" required>
                    </div>
                    <button type="submit" id="btn-envoyer" class="btn-submit">Poster le bijou</button>
                </form>
            </div>

            <!-- Liste des produits publiés -->
            <div class="list-card">
                <h2>Bijoux en ligne</h2>
                <table class="table-admin">
                    <thead>
                        <tr>
                            <th>Image</th>
                            <th>Nom</th>
                            <th>Prix</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="admin-produits">
                        <!-- Produits Supabase injectés ici -->
                    </tbody>
                </table>
            </div>
        </div>
    </section>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
