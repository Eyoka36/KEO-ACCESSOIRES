    <!-- SCRIPT JAVASCRIPT ES MODULE -->
    <script type="module">
        import { getProduits, ajouterFavori, ajouterAuPanier } from "./js/supabase.js";

        document.addEventListener("DOMContentLoaded", async function() {

            /* Récupération et rendu dynamique des produits */
            const productsListContainer = document.getElementById("products-list");
            
            try {
                const produits = await getProduits();
                console.log("Produits reçus :", produits);

                if (produits && produits.length > 0) {
                    // On affiche les 6 derniers produits publiés
                    const derniersProduits = produits.slice(0, 6);

                    productsListContainer.innerHTML = derniersProduits.map(prod => {
                        // Prise en charge de 'image' ou 'image_url'
                        const imageSrc = prod.image || prod.image_url || 'images/default.jpg';
                        const nomProduit = prod.nom || 'Bijou KEO';
                        const prixProduit = prod.prix ? prod.prix.toLocaleString() + ' FCFA' : '';

                        return `
                            <div class="product-card">
                                <img src="${imageSrc}" alt="${nomProduit}">
                                <h3>${nomProduit}</h3>
                                <p style="font-weight:600; color:var(--gold);">${prixProduit}</p>
                                <div style="display:flex; gap:10px; padding:0 20px 10px;">
                                    <button class="btn-fav" data-id="${prod.id}" style="background:#f7f7f7; color:#111; padding:10px 15px; margin:0;">❤️</button>
                                    <button class="btn-add-cart" data-id="${prod.id}" style="flex:1; margin:0;">Ajouter au panier</button>
                                </div>
                            </div>
                        `;
                    }).join("");

                    // Gestion des clics Panier & Favoris
                    derniersProduits.forEach(prod => {
                        const card = Array.from(productsListContainer.children).find(
                            el => el.querySelector('.btn-add-cart')?.dataset.id == prod.id
                        );

                        if (card) {
                            card.querySelector('.btn-add-cart').addEventListener('click', () => {
                                ajouterAuPanier(prod);
                                majCompteurs();
                                alert(`${prod.nom} ajouté au panier ! 🛒`);
                            });

                            card.querySelector('.btn-fav').addEventListener('click', () => {
                                ajouterFavori(prod);
                                majCompteurs();
                                alert(`${prod.nom} ajouté aux favoris ! ❤️`);
                            });
                        }
                    });

                } else {
                    productsListContainer.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>Aucun bijou disponible pour le moment.</p>";
                }
            } catch (error) {
                console.error("Erreur lors de la récupération des produits :", error);
                if (productsListContainer) {
                    productsListContainer.innerHTML = "<p style='grid-column:1/-1; text-align:center;'>Impossible de charger les bijoux actuellement.</p>";
                }
            }

            /* Mise à jour des badges Panier et Favoris */
            function majCompteurs() {
                let favoris = JSON.parse(localStorage.getItem("keo_favoris")) || [];
                const favorisCount = document.getElementById("favoris-count");
                if (favorisCount) favorisCount.textContent = favoris.length;

                let panier = JSON.parse(localStorage.getItem("keo_panier")) || [];
                const panierCount = document.getElementById("panier-count");
                if (panierCount) panierCount.textContent = panier.length;
            }

            majCompteurs();

            /* Assistant IA KEO */
            const aiButton = document.querySelector(".ai-button");
            const aiBox = document.querySelector(".ai-box");

            if (aiButton && aiBox) {
                aiButton.addEventListener("click", () => {
                    aiBox.style.display = (aiBox.style.display === "block") ? "none" : "block";
                });
            }

            const aiChoices = document.querySelectorAll(".ai-box button");
            aiChoices.forEach(button => {
                button.addEventListener("click", () => {
                    let style = button.textContent.trim();
                    let message = "";

                    switch(style) {
                        case "Élégant":
                            message = "Je vous conseille un collier fin doré et une bague élégante pour un style raffiné ✨";
                            break;
                        case "Mariage":
                            message = "Pour un mariage, choisissez une parure lumineuse avec des détails précieux 💎";
                            break;
                        case "Cadeau":
                            message = "Un bracelet personnalisé ou une bague symbolique serait un magnifique cadeau 🎁";
                            break;
                        default:
                            message = "Découvrez notre collection KEO Accessoires 🤍";
                    }
                    alert(message);
                });
            });

            /* Animation au Scroll */
            const elements = document.querySelectorAll(".card, .product-card, .review");
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.opacity = "1";
                        entry.target.style.transform = "translateY(0)";
                    }
                });
            }, { threshold: 0.15 });

            elements.forEach(element => {
                element.style.opacity = "0";
                element.style.transform = "translateY(40px)";
                element.style.transition = "0.6s";
                observer.observe(element);
            });

            /* Smooth Scroll */
            document.querySelectorAll("a[href^='#']").forEach(link => {
                link.addEventListener("click", function(e) {
                    const targetId = this.getAttribute("href");
                    if (targetId !== '#') {
                        e.preventDefault();
                        const targetElement = document.querySelector(targetId);
                        if (targetElement) {
                            targetElement.scrollIntoView({ behavior: "smooth" });
                        }
                    }
                });
            });
        });
    </script>
