<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Accessoires - Panier</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --black: #111111;
            --white: #ffffff;
            --gold: #D4AF37;
            --light-bg: #fafafa;
            --gray: #777777;
            --border: #eeeeee;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--white); color: var(--black); line-height: 1.6; }
        h1, h2 { font-family: 'Playfair Display', serif; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: 'Poppins', sans-serif; transition: var(--transition); }

        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: var(--white); display: flex; align-items: center; justify-content: space-between;
            padding: 0 7%; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .logo { font-size: 26px; font-weight: 700; }
        .logo span { color: var(--gold); }
        nav { display: flex; gap: 30px; }
        nav a:hover { color: var(--gold); }
        .actions { font-size: 20px; }

        .cart-page { padding: 120px 7% 60px; min-height: 80vh; }
        .cart-page h1 { font-size: 45px; text-align: center; margin-bottom: 30px; }

        #cart-container { max-width: 800px; margin: 0 auto 30px; }
        .cart-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px; background: var(--light-bg); border-radius: 15px; margin-bottom: 15px;
            box-shadow: var(--shadow);
        }

        #total { text-align: center; font-size: 28px; color: var(--gold); margin-bottom: 30px; }
        #order-whatsapp {
            display: block; margin: 0 auto; padding: 15px 40px; background: #25D366;
            color: var(--white); border: none; border-radius: 30px; font-size: 16px; font-weight: 600;
        }
        #order-whatsapp:hover { background: #1eb956; transform: translateY(-2px); }

        @media (max-width: 900px) {
            .header { padding: 0 20px; }
            nav { display: none; }
            .cart-page { padding-left: 20px; padding-right: 20px; }
            .cart-page h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">KEO <span>Accessoires</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="boutique.html">Boutique</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="actions">
            <a href="favoris.html">❤️</a>
        </div>
    </header>

    <section class="cart-page">
        <h1>Votre panier</h1>
        <div id="cart-container">
            <!-- Contenu injecté dynamiquement via panier.js -->
        </div>
        <h2 id="total">Total : 0 FCFA</h2>
        <button id="order-whatsapp">Commander sur WhatsApp</button>
    </section>

    <script src="js/panier.js"></script>
</body>
</html>
