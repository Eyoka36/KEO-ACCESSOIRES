<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEO Accessoires - Boutique</title>

    <!-- Polices -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --black: #111111;
            --white: #ffffff;
            --gold: #D4AF37;
            --light-bg: #fafafa;
            --gray: #777777;
            --border: #eeeeee;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            --transition: 0.3s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Poppins', sans-serif; background: var(--white); color: var(--black); line-height: 1.6; }
        h1, h2, h3 { font-family: 'Playfair Display', serif; }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: 'Poppins', sans-serif; transition: var(--transition); }

        /* HEADER */
        .header {
            position: fixed; top: 0; left: 0; width: 100%; height: 80px;
            background: var(--white); display: flex; align-items: center; justify-content: space-between;
            padding: 0 7%; z-index: 1000; box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .logo { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
        .logo span { color: var(--gold); }
        nav { display: flex; gap: 30px; }
        nav a { font-size: 15px; font-weight: 500; transition: var(--transition); }
        nav a:hover { color: var(--gold); }
        .actions { display: flex; gap: 20px; font-size: 20px; }

        /* CONTENU */
        .shop { padding: 120px 7% 60px; min-height: 80vh; }
        .shop h1 { font-size: 45px; text-align: center; margin-bottom: 10px; }
        .shop p { text-align: center; color: var(--gray); margin-bottom: 40px; }

        /* FILTRES & RECHERCHE */
        .search-box { display: flex; justify-content: center; margin-bottom: 30px; }
        .search-box input {
            width: 100%; max-width: 500px; padding: 15px 25px;
            border: 1px solid var(--border); border-radius: 30px; font-size: 15px;
            outline: none; background: var(--light-bg); transition: var(--transition);
        }
        .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }

        .categories { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 50px; }
        .categories button {
            padding: 10px 25px; border: 1px solid var(--border); background: var(--white);
            border-radius: 25px; font-size: 14px; font-weight: 500;
        }
        .categories button:hover, .categories button.active { background: var(--black); color: var(--white); border-color: var(--black); }

        /* LISTE PRODUITS */
        .product-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
        .product-card {
            background: var(--white); border-radius: 20px; overflow: hidden;
            box-shadow: var(--shadow); padding: 20px; text-align: center;
            display: flex; flex-direction: column; justify-content: space-between; transition: var(--transition);
        }
        .product-card:hover { transform: translateY(-8px); }
        .product-card img { width: 100%; height: 260px; object-fit: cover; border-radius: 15px; margin-bottom: 15px; }
        .product-card h3 { font-size: 20px; margin-bottom: 10px; }
        .product-card .price { font-size: 18px; font-weight: 600; color: var(--gold); margin-bottom: 5px; }
        .product-card .stock { font-size: 13px; color: var(--gray); margin-bottom: 15px; }

        .product-actions { display: flex; gap: 10px; justify-content: center; }
        .btn-favori { padding: 10px 15px; border: 1px solid var(--border); background: var(--light-bg); border-radius: 12px; font-size: 16px; }
        .btn-favori:hover { background: #ffe6e6; border-color: red; }
        .btn-panier { flex: 1; padding: 10px 20px; border: none; background: var(--black); color: var(--white); border-radius: 12px; font-weight: 500; }
        .btn-panier:hover { background: var(--gold); }

        /* ASSISTANT IA */
        .ai-button { position: fixed; left: 25px; bottom: 30px; width: 60px; height: 60px; border-radius: 50%; border: none; background: var(--black); color: var(--white); font-size: 25px; z-index: 999; }
        .ai-box { display: none; position: fixed; left: 25px; bottom: 100px; width: 280px; background: var(--white); padding: 25px; border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); z-index: 999; }

        @media (max-width: 900px) {
            .header { padding: 0 20px; }
            nav { display: none; }
            .shop { padding-left: 20px; padding-right: 20px; }
            .shop h1 { font-size: 32px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo">KEO <span>Accessoires</span></div>
        <nav>
            <a href="index.html">Accueil</a>
            <a href="boutique.html">Boutique</a>
            <a href="histoire.html">Histoire</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="actions">
            <a href="favoris.html">❤️</a>
            <a href="panier.html">🛒</a>
        </div>
    </header>

    <section class="shop">
        <h1>Notre collection</h1>
        <p>Découvrez nos bijoux élégants.</p>

        <div class="search-box">
            <input type="search" id="search" placeholder="Rechercher un bijou...">
        </div>

        <div class="categories">
            <button data-cat="Tous" class="active">Tous</button>
            <button data-cat="Collier">Colliers</button>
            <button data-cat="Bracelet">Bracelets</button>
            <button data-cat="Bague">Bagues</button>
            <button data-cat="Parure">Parures</button>
        </div>

        <div class="product-container" id="boutique-produits">
            <!-- Injecté dynamiquement depuis Supabase -->
        </div>
    </section>

    <button class="ai-button">🤖</button>
    <div class="ai-box">
        <h3>KEO Assistant</h3>
        <p>Besoin d'un conseil beauté ?</p>
    </div>

    <script type="module" src="js/boutique.js"></script>
</body>
</html>
